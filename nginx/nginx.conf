upstream tiktok_scheduler_web {
    server web:3000;
    keepalive 16;
}

# Uploads are capped at MAX_UPLOAD_SIZE_MB (287 MB is TikTok's hard ceiling); leave headroom
# for multipart boundaries so nginx rejects only genuinely oversized requests.
client_max_body_size 320m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uncomment once ./nginx/certs/*.pem exist and the TLS server block below is enabled.
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # location / { return 301 https://$host$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    location /api/videos/upload {
        proxy_pass http://tiktok_scheduler_web;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://tiktok_scheduler_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

